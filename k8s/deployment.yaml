apiVersion: apps/v1
kind: Deployment
metadata:
  name: eks-2048
  namespace: game-2048
  labels:
    app.kubernetes.io/name: eks-2048
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: eks-2048
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eks-2048
    spec:
      # The app never calls the Kubernetes API, so don't give it a token.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      # Spread the replicas over AZs so losing one zone doesn't take the game down.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: eks-2048
      containers:
        - name: web
          image: eks-2048 # real repo + tag set in kustomization.yaml
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # nginx's only writable path (pid + temp files), see app/nginx.conf
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
