# Argo CD renders this folder with Kustomize. To deploy a new image, change
# newTag (CI will do it with `kustomize edit set image` in Task 5).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - pdb.yaml
images:
  - name: eks-2048
    newName: 590184076390.dkr.ecr.eu-west-2.amazonaws.com/eks-2048
    newTag: ec0b220
