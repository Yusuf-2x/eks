# NGINX config for the 2048 static site. Replaces the image's default config entirely.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Everything nginx writes goes to /tmp, so the rest of the filesystem can be read-only
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;

    # Don't advertise the nginx version in headers or error pages
    server_tokens off;

    sendfile    on;
    tcp_nopush  on;

    # Static site: nothing is ever uploaded, so refuse request bodies and drop slow clients
    client_max_body_size        1k;
    client_body_timeout         10s;
    client_header_timeout       10s;
    send_timeout                10s;
    keepalive_timeout           15s;
    large_client_header_buffers 4 8k;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    server {
        listen 8080 default_server;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # Security headers. The game loads all its JS/CSS/fonts/images from its own origin
        # with no inline code, so the CSP can be strict. HSTS is added later at the ingress,
        # where TLS terminates (browsers ignore HSTS sent over plain HTTP).
        # NOTE: an add_header inside a location{} would drop all of these for that location.
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;

        # Only reading is allowed
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        # Liveness/readiness endpoint for Docker / Kubernetes probes
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Never serve dotfiles (.git, .env, ...) even if one ends up in the image
        location ~ /\. {
            return 404;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
